<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store - Premium E-Commerce</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-zinc-950 text-zinc-100 font-sans antialiased">

    <!-- Header / Logo -->
    <header class="sticky top-0 z-50 bg-zinc-900/90 backdrop-blur border-b border-zinc-800 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <div class="bg-rose-600 text-white font-bold px-3 py-1.5 rounded-lg text-xl tracking-wider">STORE</div>
            <span class="text-xs text-zinc-400 hidden sm:inline">Secure Crypto Checkout</span>
        </div>
        <button onclick="openCart()" class="relative bg-zinc-800 hover:bg-zinc-700 px-4 py-2 rounded-full text-sm font-medium flex items-center space-x-2 transition">
            <i class="fa-solid fa-cart-shopping text-rose-500"></i>
            <span>Cart</span>
            <span id="cart-count" class="bg-rose-600 text-white text-xs px-2 py-0.5 rounded-full">0</span>
        </button>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        <!-- Products Grid -->
        <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Dynamically populated products -->
        </div>
    </main>

    <!-- Product Detail Modal -->
    <div id="product-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4 overflow-y-auto">
        <div class="bg-zinc-900 border border-zinc-800 rounded-2xl max-w-4xl w-full p-6 relative max-h-[90vh] overflow-y-auto">
            <button onclick="closeProductModal()" class="absolute top-4 right-4 text-zinc-400 hover:text-white text-xl bg-zinc-800 w-10 h-10 rounded-full flex items-center justify-center">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <div>
                    <div class="bg-zinc-950 rounded-xl overflow-hidden mb-4 border border-zinc-800 h-80 flex items-center justify-center">
                        <img id="modal-main-img" src="" alt="" class="max-h-full max-w-full object-cover">
                    </div>
                    <div id="modal-thumbnails" class="flex space-x-2 overflow-x-auto pb-2">
                        <!-- Thumbnails -->
                    </div>
                </div>
                <div class="flex flex-col justify-between">
                    <div>
                        <h2 id="modal-title" class="text-2xl font-bold mb-2 text-zinc-100"></h2>
                        <p id="modal-price" class="text-2xl text-rose-500 font-semibold mb-4"></p>
                        <p id="modal-desc" class="text-zinc-400 text-sm mb-6 leading-relaxed"></p>
                    </div>
                    <div>
                        <div class="flex items-center space-x-4 mb-6">
                            <label class="text-sm text-zinc-400">Quantity:</label>
                            <div class="flex items-center border border-zinc-700 rounded-lg overflow-hidden">
                                <button onclick="adjustQty(-1)" class="px-3 py-1 bg-zinc-800 hover:bg-zinc-700">-</button>
                                <span id="modal-qty" class="px-4 py-1 text-center w-12">1</span>
                                <button onclick="adjustQty(1)" class="px-3 py-1 bg-zinc-800 hover:bg-zinc-700">+</button>
                            </div>
                        </div>
                        <button onclick="addToCartFromModal()" class="w-full bg-rose-600 hover:bg-rose-500 text-white font-semibold py-3 rounded-xl transition shadow-lg shadow-rose-600/20">
                            Add to Cart
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Checkout / Cart Drawer & Modal -->
    <div id="cart-drawer" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex justify-end">
        <div class="bg-zinc-900 border-l border-zinc-800 w-full max-w-md h-full flex flex-col justify-between p-6 overflow-y-auto">
            <div>
                <div class="flex justify-between items-center mb-6 border-b border-zinc-800 pb-4">
                    <h2 class="text-xl font-bold">Your Checkout</h2>
                    <button onclick="closeCart()" class="text-zinc-400 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
                </div>

                <!-- Steps Navigation Indicator -->
                <div class="flex justify-between mb-6 text-xs text-zinc-400 border-b border-zinc-800 pb-2">
                    <span id="step-1-ind" class="text-rose-500 font-bold">1. Cart</span>
                    <span id="step-2-ind">2. Details</span>
                    <span id="step-3-ind">3. Crypto Payment</span>
                </div>

                <!-- Step 1: Cart Items -->
                <div id="step-1-content">
                    <div id="cart-items-list" class="space-y-4 mb-6 max-h-60 overflow-y-auto">
                        <!-- Items -->
                    </div>
                    <div class="border-t border-zinc-800 pt-4 mb-6">
                        <div class="flex justify-between text-lg font-bold">
                            <span>Subtotal:</span>
                            <span id="cart-subtotal">$0.00</span>
                        </div>
                    </div>
                    <button onclick="goToStep(2)" class="w-full bg-rose-600 hover:bg-rose-500 text-white font-semibold py-3 rounded-xl transition">
                        Proceed to Shipping Info
                    </button>
                </div>

                <!-- Step 2: Customer Details & Shipping Option -->
                <div id="step-2-content" class="hidden space-y-4">
                    <div>
                        <label class="block text-xs text-zinc-400 mb-1">Full Name</label>
                        <input type="text" id="cust-name" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-rose-500" placeholder="John Doe">
                    </div>
                    <div>
                        <label class="block text-xs text-zinc-400 mb-1">Mobile Number</label>
                        <input type="text" id="cust-phone" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-rose-500" placeholder="+92 300 1234567">
                    </div>
                    <div>
                        <label class="block text-xs text-zinc-400 mb-1">Delivery Address</label>
                        <textarea id="cust-address" rows="3" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-rose-500" placeholder="Street, City, Country"></textarea>
                    </div>
                    <div>
                        <label class="block text-xs text-zinc-400 mb-1">Delivery Speed</label>
                        <select id="delivery-speed" onchange="updateTotal()" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-rose-500">
                            <option value="standard">Standard Delivery (Free)</option>
                            <option value="fast">24-Hour Express Fast Delivery (+30%)</option>
                        </select>
                    </div>
                    <div class="flex space-x-2 pt-4">
                        <button onclick="goToStep(1)" class="w-1/3 bg-zinc-800 hover:bg-zinc-700 text-white font-semibold py-3 rounded-xl transition">Back</button>
                        <button onclick="goToStep(3)" class="w-2/3 bg-rose-600 hover:bg-rose-500 text-white font-semibold py-3 rounded-xl transition">Proceed to Payment</button>
                    </div>
                </div>

                <!-- Step 3: Crypto Payment & Dynamic QR -->
                <div id="step-3-content" class="hidden space-y-4">
                    <div>
                        <label class="block text-xs text-zinc-400 mb-1">Select Cryptocurrency Wallet</label>
                        <select id="crypto-select" onchange="renderPaymentQR()" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-rose-500">
                            <option value="usdt_trc20">USDT (TRC20 - Binance)</option>
                            <option value="usdt_erc20">USDT (ERC/Trust Wallet)</option>
                            <option value="btc_binance">Bitcoin (Binance)</option>
                            <option value="btc_trust">Bitcoin (Trust Wallet)</option>
                            <option value="bnb_bsc">BNB / BSC (Binance)</option>
                        </select>
                    </div>

                    <div class="bg-zinc-950 p-4 rounded-xl border border-zinc-800 text-center">
                        <p class="text-sm text-zinc-400 mb-2">Total Amount to Pay:</p>
                        <p id="final-payable-amount" class="text-xl font-bold text-rose-500 mb-4">$0.00</p>
                        
                        <div class="bg-white p-3 inline-block rounded-lg mb-3">
                            <img id="dynamic-qr-img" src="" alt="Payment QR Code" class="w-48 h-48 object-contain">
                        </div>
                        
                        <p class="text-xs text-zinc-400 mb-1">Send exact funds to address:</p>
                        <div class="bg-zinc-900 p-2 rounded border border-zinc-800 flex items-center justify-between">
                            <span id="wallet-address-text" class="text-xs font-mono text-zinc-300 truncate mr-2"></span>
                            <button onclick="copyAddress()" class="text-rose-500 hover:text-rose-400 text-xs font-semibold px-2 py-1 bg-zinc-800 rounded">Copy</button>
                        </div>
                    </div>

                    <div class="flex space-x-2 pt-2">
                        <button onclick="goToStep(2)" class="w-1/3 bg-zinc-800 hover:bg-zinc-700 text-white font-semibold py-3 rounded-xl transition">Back</button>
                        <button onclick="completeOrderWhatsApp()" class="w-2/3 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 rounded-xl transition flex items-center justify-center space-x-2">
                            <i class="fa-brands fa-whatsapp text-lg"></i>
                            <span>Confirm & Send Order</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Sample Products (representing initial links)
        const products = [
            {
                id: 1,
                name: "Premium Wellness Formula Ronic N",
                price: 45.00,
                desc: "High-grade premium formulation designed for maximum daily vitality. Crafted with international standards.",
                images: [
                    "https://images.unsplash.com/photo-1584308666744-24d5c474f2ae?w=600",
                    "https://images.unsplash.com/photo-1471864190281-a93a3070b6de?w=600"
                ]
            },
            {
                id: 2,
                name: "Advanced Centrovit Supplement",
                price: 30.00,
                desc: "Complete multivitamin complex supporting holistic health and sustained daily performance.",
                images: [
                    "https://images.unsplash.com/photo-1550572017-edd951b55104?w=600",
                    "https://images.unsplash.com/photo-1584017911766-d451b3d0e843?w=600"
                ]
            },
            {
                id: 3,
                name: "D3 Life Immunity Booster",
                price: 25.00,
                desc: "Essential vitamin support for bone health, immune defense, and cellular protection.",
                images: [
                    "https://images.unsplash.com/photo-1576602976047-174e57a47881?w=600",
                    "https://images.unsplash.com/photo-1584308666744-24d5c474f2ae?w=600"
                ]
            }
        ];

        // Wallet Addresses from your provided screenshots
        const wallets = {
            usdt_trc20: "TFQvBjw2BioW9V32XLuMRy9R8V3iMFB5VY",
            usdt_erc20: "0xc5ccE5826F48C601fD75682D19a1e3D99d16aC13",
            btc_binance: "13yyGoV82LjzkaANnyRm9vsBYVbWQr4gWf",
            btc_trust: "bc1qtwau20lqspct0llnvlagg752sfj7gn64055tcn",
            bnb_bsc: "0xedda0b384c170672dfc6ca7e6196ef5c5f4bc6b"
        };

        let cart = [];
        let currentModalProduct = null;
        let modalQty = 1;

        // Render Product Grid
        function renderProducts() {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = products.map(p => `
                <div onclick="openProductModal(${p.id})" class="bg-zinc-900 border border-zinc-800 rounded-2xl overflow-hidden cursor-pointer hover:border-zinc-700 transition group">
                    <div class="h-48 bg-zinc-950 overflow-hidden flex items-center justify-center p-4">
                        <img src="${p.images[0]}" alt="${p.name}" class="object-cover h-full group-hover:scale-105 transition duration-300">
                    </div>
                    <div class="p-4">
                        <h3 class="font-semibold text-zinc-100 truncate mb-1">${p.name}</h3>
                        <p class="text-rose-500 font-bold">$${p.price.toFixed(2)}</p>
                    </div>
                </div>
            `).join('');
        }

        // Modal Handling
        function openProductModal(id) {
            currentModalProduct = products.find(p => p.id === id);
            modalQty = 1;
            document.getElementById('modal-qty').innerText = modalQty;
            document.getElementById('modal-title').innerText = currentModalProduct.name;
            document.getElementById('modal-price').innerText = `$${currentModalProduct.price.toFixed(2)}`;
            document.getElementById('modal-desc').innerText = currentModalProduct.desc;
            document.getElementById('modal-main-img').src = currentModalProduct.images[0];

            const thumbContainer = document.getElementById('modal-thumbnails');
            thumbContainer.innerHTML = currentModalProduct.images.map((img, idx) => `
                <img src="${img}" onclick="document.getElementById('modal-main-img').src='${img}'" class="w-16 h-16 object-cover rounded-lg border border-zinc-700 cursor-pointer hover:opacity-75">
            `).join('');

            document.getElementById('product-modal').classList.remove('hidden');
        }

        function closeProductModal() {
            document.getElementById('product-modal').classList.add('hidden');
        }

        function adjustQty(change) {
            modalQty += change;
            if (modalQty < 1) modalQty = 1;
            document.getElementById('modal-qty').innerText = modalQty;
        }

        function addToCartFromModal() {
            const existing = cart.find(item => item.id === currentModalProduct.id);
            if (existing) {
                existing.qty += modalQty;
            } else {
                cart.push({ ...currentModalProduct, qty: modalQty });
            }
            updateCartCount();
            closeProductModal();
            openCart();
        }

        function updateCartCount() {
            const totalCount = cart.reduce((sum, item) => sum + item.qty, 0);
            document.getElementById('cart-count').innerText = totalCount;
        }

        function openCart() {
            renderCartItems();
            document.getElementById('cart-drawer').classList.remove('hidden');
        }

        function closeCart() {
            document.getElementById('cart-drawer').classList.add('hidden');
        }

        function renderCartItems() {
            const list = document.getElementById('cart-items-list');
            if (cart.length === 0) {
                list.innerHTML = '<p class="text-zinc-500 text-center py-4">Your cart is empty</p>';
            } else {
                list.innerHTML = cart.map((item, idx) => `
                    <div class="flex justify-between items-center bg-zinc-950 p-3 rounded-xl border border-zinc-800">
                        <div>
                            <h4 class="text-sm font-semibold text-zinc-200">${item.name}</h4>
                            <p class="text-xs text-zinc-400">$${item.price.toFixed(2)} x ${item.qty}</p>
                        </div>
                        <button onclick="removeFromCart(${idx})" class="text-rose-500 hover:text-rose-400 text-sm"><i class="fa-solid fa-trash"></i></button>
                    </div>
                `).join('');
            }
            updateTotal();
        }

        function removeFromCart(idx) {
            cart.splice(idx, 1);
            updateCartCount();
            renderCartItems();
        }

        function calculateSubtotal() {
            return cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
        }

        function updateTotal() {
            let subtotal = calculateSubtotal();
            const speed = document.getElementById('delivery-speed').value;
            let finalAmount = speed === 'fast' ? subtotal * 1.30 : subtotal;
            document.getElementById('cart-subtotal').innerText = `$${finalAmount.toFixed(2)}`;
            document.getElementById('final-payable-amount').innerText = `$${finalAmount.toFixed(2)}`;
        }

        function goToStep(step) {
            document.getElementById('step-1-content').classList.add('hidden');
            document.getElementById('step-2-content').classList.add('hidden');
            document.getElementById('step-3-content').classList.add('hidden');

            document.getElementById('step-1-ind').className = "text-zinc-400";
            document.getElementById('step-2-ind').className = "text-zinc-400";
            document.getElementById('step-3-ind').className = "text-zinc-400";

            if (step === 1) {
                document.getElementById('step-1-content').classList.remove('hidden');
                document.getElementById('step-1-ind').className = "text-rose-500 font-bold";
            } else if (step === 2) {
                if (cart.length === 0) { alert('Your cart is empty!'); return; }
                document.getElementById('step-2-content').classList.remove('hidden');
                document.getElementById('step-2-ind').className = "text-rose-500 font-bold";
            } else if (step === 3) {
                const name = document.getElementById('cust-name').value;
                const phone = document.getElementById('cust-phone').value;
                const address = document.getElementById('cust-address').value;
                if (!name || !phone || !address) {
                    alert('Please fill out your name, mobile number, and delivery address first.');
                    goToStep(2);
                    return;
                }
                document.getElementById('step-3-content').classList.remove('hidden');
                document.getElementById('step-3-ind').className = "text-rose-500 font-bold";
                renderPaymentQR();
            }
        }

        function renderPaymentQR() {
            const cryptoKey = document.getElementById('crypto-select').value;
            const address = wallets[cryptoKey];
            let subtotal = calculateSubtotal();
            const speed = document.getElementById('delivery-speed').value;
            let finalAmount = speed === 'fast' ? subtotal * 1.30 : subtotal;

            document.getElementById('wallet-address-text').innerText = address;
            
            // Generate dynamic QR code matching wallet address and amount
            let qrData = address;
            if (cryptoKey.includes('usdt')) {
                qrData = `ethereum:${address}?value=${finalAmount.toFixed(2)}`;
            } else if (cryptoKey.includes('btc')) {
                qrData = `bitcoin:${address}?amount=${(finalAmount / 60000).toFixed(6)}`; // Approximate BTC conversion rate mockup
            }

            document.getElementById('dynamic-qr-img').src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(qrData)}`;
        }

        function copyAddress() {
            const addr = document.getElementById('wallet-address-text').innerText;
            navigator.clipboard.writeText(addr);
            alert('Wallet address copied to clipboard!');
        }

        function completeOrderWhatsApp() {
            const name = document.getElementById('cust-name').value;
            const phone = document.getElementById('cust-phone').value;
            const address = document.getElementById('cust-address').value;
            const speed = document.getElementById('delivery-speed').value;
            const crypto = document.getElementById('crypto-select').value;
            let subtotal = calculateSubtotal();
            let finalAmount = speed === 'fast' ? subtotal * 1.30 : subtotal;

            let itemsText = cart.map(i => `- ${i.name} (Qty: ${i.qty}) - $${(i.price * i.qty).toFixed(2)}`).join('\n');

            let message = `🚀 *New Order Received!*\n\n` +
                          `👤 *Customer Name:* ${name}\n` +
                          `📞 *Phone:* ${phone}\n` +
                          `📍 *Address:* ${address}\n` +
                          `🚚 *Delivery:* ${speed === 'fast' ? '24-Hour Express (+30%)' : 'Standard'}\n\n` +
                          `📦 *Products:*\n${itemsText}\n\n` +
                          `💰 *Total Amount:* $${finalAmount.toFixed(2)}\n` +
                          `🪙 *Payment Crypto:* ${crypto.toUpperCase()}\n` +
                          `📫 *Wallet Used:* ${wallets[crypto]}`;

            // Replace with your actual WhatsApp phone number if needed, or leave it ready for user
            let whatsappUrl = `https://wa.me/?text=${encodeURIComponent(message)}`;
            window.open(whatsappUrl, '_blank');
        }

        // Initialize grid on load
        renderProducts();
    </script>
</body>
</html>
