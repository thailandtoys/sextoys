<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEX TOYS | 成人用品 Direct Factory Wholesale</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .gradient-text {
            background: linear-gradient(135deg, #fb7185 0%, #e11d48 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 font-sans antialiased selection:bg-rose-500 selection:text-white">

    <!-- Top Wholesale Banner -->
    <div class="bg-gradient-to-r from-rose-900 via-rose-700 to-rose-900 text-white text-xs py-2 px-4 text-center font-medium shadow-md">
        <i class="fa-solid fa-industry mr-2"></i>
        <span>Direct Factory Supply from China | Wholesale Prices | 中国工厂直供 - 批发特惠价</span>
    </div>

    <!-- Top Navigation Bar / Header -->
    <header class="sticky top-0 z-50 bg-zinc-900/90 backdrop-blur-md border-b border-zinc-800 shadow-xl">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <a href="#" class="flex items-center space-x-3 group">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-rose-600 to-pink-500 flex items-center justify-center text-white font-black text-xl shadow-lg shadow-rose-600/30 group-hover:scale-105 transition duration-300">
                    ST
                </div>
                <div class="flex flex-col">
                    <span class="text-xl font-extrabold tracking-wider text-white flex items-center gap-1">
                        SEX TOYS <span class="text-xs text-rose-400 font-bold">成人用品</span>
                    </span>
                    <span class="text-[10px] text-zinc-400 tracking-widest uppercase">China Direct Factory Supply | 中国工厂直供</span>
                </div>
            </a>

            <div class="flex items-center space-x-3">
                <button onclick="promptAdminLogin()" class="bg-zinc-800/80 hover:bg-zinc-700 text-zinc-400 px-3 py-2 rounded-xl text-xs font-semibold border border-zinc-700 transition flex items-center gap-1.5">
                    <i class="fa-solid fa-lock text-rose-500"></i>
                    <span>Admin</span>
                </button>
                <button onclick="openCart()" class="relative bg-rose-600 hover:bg-rose-500 text-white px-4 py-2 rounded-xl text-sm font-semibold flex items-center space-x-2 transition shadow-lg shadow-rose-600/25">
                    <i class="fa-solid fa-bag-shopping"></i>
                    <span>Cart / 购物车</span>
                    <span id="cart-count" class="bg-white text-rose-600 text-xs font-bold px-2 py-0.5 rounded-full ml-1">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Grid -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        <div class="flex justify-between items-end mb-6 border-b border-zinc-800 pb-4">
            <div>
                <h1 id="category-title" class="text-2xl font-bold text-white">All Collection / 全部系列</h1>
                <p class="text-xs text-zinc-400 mt-1">Direct Wholesale Prices from China Factory | 100% Confidential Delivery (保密发货)</p>
            </div>
            <span class="text-xs text-zinc-500"><i class="fa-solid fa-shield-halved text-emerald-500 mr-1"></i> Factory Direct Price</span>
        </div>

        <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>
    </main>

    <!-- Product Detail Modal Popup -->
    <div id="product-modal" class="fixed inset-0 z-50 bg-black/85 backdrop-blur-md hidden flex items-center justify-center p-4 overflow-y-auto">
        <div class="bg-zinc-900 border border-zinc-800 rounded-2xl max-w-4xl w-full p-6 relative max-h-[90vh] overflow-y-auto shadow-2xl">
            <button onclick="closeProductModal()" class="absolute top-4 right-4 text-zinc-400 hover:text-white bg-zinc-800 w-9 h-9 rounded-full flex items-center justify-center transition">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <div>
                    <div id="modal-media-container" class="bg-zinc-950 rounded-xl overflow-hidden mb-3 border border-zinc-800 h-80 flex items-center justify-center relative"></div>
                    <div id="modal-thumbnails" class="flex space-x-2 overflow-x-auto pb-2"></div>
                </div>
                <div class="flex flex-col justify-between">
                    <div>
                        <span id="modal-category-badge" class="text-[10px] font-bold uppercase tracking-widest text-rose-500 bg-rose-500/10 px-2.5 py-1 rounded-full border border-rose-500/20"></span>
                        <h2 id="modal-title" class="text-2xl font-bold mt-2 mb-2 text-zinc-100"></h2>
                        <div class="flex items-center space-x-3 mb-4">
                            <span id="modal-price" class="text-2xl text-rose-500 font-extrabold"></span>
                            <span id="modal-original-price" class="text-sm text-zinc-500 line-through"></span>
                            <span id="modal-discount-tag" class="text-xs bg-rose-500/20 text-rose-400 font-bold px-2 py-0.5 rounded-md border border-rose-500/30"></span>
                        </div>
                        <p id="modal-desc" class="text-zinc-300 text-sm leading-relaxed mb-6"></p>
                    </div>
                    <div class="pt-4 border-t border-zinc-800">
                        <div class="flex items-center space-x-4 mb-4">
                            <label class="text-xs font-semibold text-zinc-400">Quantity / 数量:</label>
                            <div class="flex items-center border border-zinc-700 rounded-lg overflow-hidden bg-zinc-950">
                                <button onclick="adjustQty(-1)" class="px-3 py-1 bg-zinc-800 hover:bg-zinc-700 text-white font-bold">-</button>
                                <span id="modal-qty" class="px-4 py-1 text-center w-10 text-sm font-semibold">1</span>
                                <button onclick="adjustQty(1)" class="px-3 py-1 bg-zinc-800 hover:bg-zinc-700 text-white font-bold">+</button>
                            </div>
                        </div>
                        <button onclick="addToCartFromModal()" class="w-full bg-rose-600 hover:bg-rose-500 text-white font-bold py-3 rounded-xl transition shadow-lg shadow-rose-600/30 flex items-center justify-center gap-2">
                            <i class="fa-solid fa-cart-plus"></i> Add to Cart / 加入购物车
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Cart Drawer -->
    <div id="cart-drawer" class="fixed inset-0 z-50 bg-black/85 backdrop-blur-md hidden flex justify-end">
        <div class="bg-zinc-900 border-l border-zinc-800 w-full max-w-md h-full flex flex-col justify-between p-6 overflow-y-auto">
            <div>
                <div class="flex justify-between items-center mb-6 border-b border-zinc-800 pb-4">
                    <h2 class="text-lg font-bold flex items-center gap-2"><i class="fa-solid fa-bag-shopping text-rose-500"></i> Cart & Checkout</h2>
                    <button onclick="closeCart()" class="text-zinc-400 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
                </div>
                <div id="cart-items-list" class="space-y-3 mb-6 max-h-60 overflow-y-auto"></div>
                <div class="border-t border-zinc-800 pt-4 mb-6">
                    <div class="flex justify-between text-base font-bold">
                        <span>Total:</span>
                        <span id="cart-subtotal">$0.00</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Reliability Image Proxy Setup to prevent Hotlink blocking
        const products = [
            {
                id: 101,
                name: "Sex Toys Vibro Titties Huggers Nipple Massager",
                category: "women",
                basePrice: 38.00,
                desc: "Vibro Titties Huggers feature flexible dual ergonomic massage pods designed for targeted stimulation.",
                media: [{ type: 'image', url: 'https://images.unsplash.com/photo-1584308666744-24d5c474f2ae?w=500&auto=format&fit=crop' }]
            },
            { 
                id: 1, 
                name: "Sex Toys Motion Elegance Probe", 
                category: "women", 
                basePrice: 12.00, 
                desc: "Dual motion precision stimulator featuring ultra-smooth finish.", 
                media: [{ type: 'image', url: 'https://images.unsplash.com/photo-1522337360788-8b13dee7a37e?w=500&auto=format&fit=crop' }] 
            },
            { 
                id: 2, 
                name: "Sex Toys Aura Pulse Dual Stimulator", 
                category: "women", 
                basePrice: 18.00, 
                desc: "Waterproof luxury dual stimulator designed for maximum ergonomics.", 
                media: [{ type: 'image', url: 'https://images.unsplash.com/photo-1584308666744-24d5c474f2ae?w=500&auto=format&fit=crop' }] 
            },
            { 
                id: 3, 
                name: "Sex Toys Velvet Touch Precision Wand", 
                category: "women", 
                basePrice: 28.00, 
                desc: "Rechargeable deep-tissue massager with dynamic flexibility.", 
                media: [{ type: 'image', url: 'https://images.unsplash.com/photo-1522337360788-8b13dee7a37e?w=500&auto=format&fit=crop' }] 
            },
            { 
                id: 4, 
                name: "Sex Toys Shared Intimacy Couples Loop", 
                category: "couples", 
                basePrice: 35.00, 
                desc: "Ergonomic couples stimulator for enhanced shared intimacy.", 
                media: [{ type: 'image', url: 'https://images.unsplash.com/photo-1584308666744-24d5c474f2ae?w=500&auto=format&fit=crop' }] 
            },
            { 
                id: 5, 
                name: "Sex Toys Ergonomic Men's Power Enhancer", 
                category: "men", 
                basePrice: 6.50, 
                desc: "Premium body-safe silicone power enhancer.", 
                media: [{ type: 'image', url: 'https://images.unsplash.com/photo-1522337360788-8b13dee7a37e?w=500&auto=format&fit=crop' }] 
            },
            { 
                id: 6, 
                name: "Sex Toys Whisper Dual Motor Massager", 
                category: "toys", 
                basePrice: 14.00, 
                desc: "Ultra-quiet dual motor probe with medical grade casing.", 
                media: [{ type: 'image', url: 'https://images.unsplash.com/photo-1584308666744-24d5c474f2ae?w=500&auto=format&fit=crop' }] 
            },
            { 
                id: 7, 
                name: "Sex Toys Compact Pocket Massager", 
                category: "toys", 
                basePrice: 5.50, 
                desc: "Discreet travel massager with multi-pattern vibrations.", 
                media: [{ type: 'image', url: 'https://images.unsplash.com/photo-1522337360788-8b13dee7a37e?w=500&auto=format&fit=crop' }] 
            }
        ];

        function calculateProductPrice(basePrice) {
            let discountPercent = basePrice <= 7 ? 30 : (basePrice <= 20 ? 40 : 50);
            return { original: basePrice, discounted: basePrice * (1 - (discountPercent / 100)), discountPercent };
        }

        let cart = [];
        let currentModalProduct = null;
        let modalQty = 1;

        function renderProducts() {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = products.map(p => {
                const pricing = calculateProductPrice(p.basePrice);
                const mainMedia = p.media[0];
                return `
                    <div onclick="openProductModal(${p.id})" class="bg-zinc-900 border border-zinc-800 rounded-2xl overflow-hidden cursor-pointer hover:border-zinc-700 transition group shadow-lg flex flex-col justify-between">
                        <div>
                            <div class="h-56 bg-zinc-950 overflow-hidden flex items-center justify-center relative">
                                <img src="${mainMedia.url}" alt="${p.name}" class="object-cover h-full w-full group-hover:scale-105 transition duration-300" onerror="this.onerror=null;this.src='https://via.placeholder.com/300x300?text=Product+Image';">
                                <span class="absolute top-2 right-2 bg-rose-600 text-[10px] uppercase font-extrabold text-white px-2 py-0.5 rounded-md">${pricing.discountPercent}% OFF</span>
                            </div>
                            <div class="p-4">
                                <h3 class="font-semibold text-zinc-100 truncate mb-2 text-sm">${p.name}</h3>
                                <div class="flex items-center space-x-2">
                                    <span class="text-rose-500 font-extrabold text-lg">$${pricing.discounted.toFixed(2)}</span>
                                    <span class="text-zinc-500 line-through text-xs">$${pricing.original.toFixed(2)}</span>
                                </div>
                            </div>
                        </div>
                        <div class="px-4 pb-4">
                            <button class="w-full bg-zinc-800 hover:bg-rose-600 text-zinc-200 hover:text-white text-xs font-semibold py-2 rounded-xl transition">
                                View Details / 查看详情
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function openProductModal(id) {
            currentModalProduct = products.find(p => p.id === id);
            const pricing = calculateProductPrice(currentModalProduct.basePrice);
            modalQty = 1;
            document.getElementById('modal-qty').innerText = modalQty;
            document.getElementById('modal-title').innerText = currentModalProduct.name;
            document.getElementById('modal-price').innerText = `$${pricing.discounted.toFixed(2)}`;
            document.getElementById('modal-original-price').innerText = `$${pricing.original.toFixed(2)}`;
            document.getElementById('modal-discount-tag').innerText = `${pricing.discountPercent}% OFF`;
            document.getElementById('modal-desc').innerText = currentModalProduct.desc;
            document.getElementById('modal-media-container').innerHTML = `<img src="${currentModalProduct.media[0].url}" class="max-h-full max-w-full object-cover rounded-lg">`;
            document.getElementById('product-modal').classList.remove('hidden');
        }

        function closeProductModal() { document.getElementById('product-modal').classList.add('hidden'); }
        function adjustQty(change) { modalQty = Math.max(1, modalQty + change); document.getElementById('modal-qty').innerText = modalQty; }
        function openCart() { document.getElementById('cart-drawer').classList.remove('hidden'); }
        function closeCart() { document.getElementById('cart-drawer').classList.add('hidden'); }

        renderProducts();
    </script>
</body>
</html>
